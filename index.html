<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>診察室 呼出モニター</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      height: 100vh; text-align: center; overflow: hidden;
    }
    #init-screen { display: flex; flex-direction: column; align-items: center; }
    #init-btn {
      padding: 24px 48px; font-size: 26px; font-weight: bold; background: #2563eb;
      color: white; border: none; border-radius: 16px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(37,99,235,0.5);
    }
    #main-ui { display: none; width: 92%; max-width: 800px; }
    .status-badge {
      display: inline-block; padding: 6px 18px; border-radius: 20px;
      background: #065f46; color: #34d399; font-size: 16px; margin-bottom: 24px; font-weight: bold;
    }
    .room-label { font-size: 36px; color: #38bdf8; font-weight: 800; margin-bottom: 16px; letter-spacing: 2px; }
    .name-card {
      background: #1e293b; border: 4px solid #3b82f6; border-radius: 28px;
      padding: 50px 24px; margin: 0 auto; box-shadow: 0 12px 35px rgba(0,0,0,0.6);
    }
    .patient-name { font-size: 68px; font-weight: 900; color: #ffffff; letter-spacing: 3px; word-break: break-all; }
    .sub-text { font-size: 26px; color: #94a3b8; margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="init-screen">
    <button id="init-btn" onclick="startReceiver()">▶ 呼出待機を開始する</button>
    <p style="color: #94a3b8; margin-top: 16px; font-size: 16px;">Bluetoothスピーカーを接続した状態でタップしてください</p>
  </div>

  <div id="main-ui">
    <div id="status" class="status-badge">● 接続待機中...</div>
    <div class="room-label">一番診察室</div>
    <div class="name-card">
      <div id="display-name" class="patient-name">---</div>
      <div id="display-sub" class="sub-text">お呼び出しまでそのままお待ちください</div>
    </div>
  </div>

  <script>
    // ==========================================
    // 【PC側と一致させる合言葉】
    // ==========================================
    const TOPIC_NAME = "clinic-call-osaka-8899";
    // ==========================================

    let synth = window.speechSynthesis;
    let isReady = false;

    function startReceiver() {
      synth.speak(new SpeechSynthesisUtterance(""));
      document.getElementById("init-screen").style.display = "none";
      document.getElementById("main-ui").style.display = "block";
      isReady = true;

      const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt");

      client.on("connect", function () {
        document.getElementById("status").innerText = "● クラウド接続完了（呼出待機中）";
        client.subscribe(TOPIC_NAME);
      });

      client.on("message", function (topic, message) {
        if (!isReady) return;
        try {
          const data = JSON.parse(message.toString());
          
          document.getElementById("display-name").innerText = data.name + " 様";
          document.getElementById("display-sub").innerText = "一番の診察室へお入りください";

          // 「ピーンポーン♪」チャイム再生
          playPinPonChime();

          // 音声読み上げ
          setTimeout(() => {
            synth.cancel();
            let speechText = data.name + "さん。いちばんのしんさつしつへ、おはいりください。";
            let uttr = new SpeechSynthesisUtterance(speechText);
            uttr.lang = "ja-JP";
            uttr.rate = 0.92;
            uttr.pitch = 1.05;
            
            let voices = synth.getVoices().filter(v => v.lang.includes("ja") || v.lang.includes("JP"));
            if (voices.length > 0) {
              uttr.voice = voices[0];
            }

            synth.speak(uttr);
          }, 1100);
        } catch(e) {}
      });
    }

    // 澄んだ「ピーン・ポーン♪」の2和音チャイム
    function playPinPonChime() {
      try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let tones = [
          { freq: 880.00, start: 0.00, dur: 0.55 }, // ピーン (A5)
          { freq: 698.46, start: 0.45, dur: 0.65 }  // ポーン (F5)
        ];

        tones.forEach(t => {
          let osc = ctx.createOscillator();
          let gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(t.freq, ctx.currentTime + t.start);
          gain.gain.setValueAtTime(0.35, ctx.currentTime + t.start);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t.start + t.dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + t.start);
          osc.stop(ctx.currentTime + t.start + t.dur);

          // ベルのような豊かな響きを重ねる倍音
          let osc2 = ctx.createOscillator();
          let gain2 = ctx.createGain();
          osc2.type = "triangle";
          osc2.frequency.setValueAtTime(t.freq * 2, ctx.currentTime + t.start);
          gain2.gain.setValueAtTime(0.12, ctx.currentTime + t.start);
          gain2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t.start + (t.dur * 0.7));
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(ctx.currentTime + t.start);
          osc2.stop(ctx.currentTime + t.start + t.dur);
        });
      } catch(e) {}
    }
  </script>
</body>
</html>
